<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Siheung Graph and MST Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQPhQ6Pvi7jI6Z0do6ihRZ9cc6pLFEw="
    crossorigin=""
  >
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      height: 100vh;
    }
    #map {
      height: 100vh;
      min-width: 0;
      background: #eef2f6;
    }
    #side-panel {
      height: 100vh;
      background: #fff;
      border-left: 1px solid #d1d5db;
      box-shadow: -2px 0 8px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      min-width: 0;
      z-index: 1100;
    }
    .panel-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid #e5e7eb;
    }
    .panel-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
    }
    .panel-subtitle {
      color: #64748b;
      font-size: 12px;
      line-height: 1.35;
      margin-top: 5px;
    }
    .panel-body {
      overflow: auto;
      padding: 14px 16px 18px;
    }
    .field {
      margin-bottom: 18px;
    }
    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .layer-row {
      align-items: center;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      cursor: pointer;
      display: grid;
      gap: 9px;
      grid-template-columns: auto 1fr auto;
      margin-bottom: 8px;
      padding: 9px 10px;
    }
    .layer-row:hover {
      background: #f8fafc;
    }
    .layer-row input {
      margin: 0;
    }
    .layer-name {
      font-size: 13px;
      font-weight: 700;
    }
    .layer-meta {

      font-size: 11px;
      margin-top: 2px;
    }
    .swatch {
      border-radius: 999px;
      height: 4px;
      width: 38px;
    }
    .swatch.graph {
      background: #64748b;
    }
    .swatch.mst {
      background: #0284c7;
    }
    .weight-panel {

      border-radius: 6px;
      padding: 10px;
    }
    .weight-row {
      display: grid;
      gap: 7px;
      grid-template-columns: 54px 1fr 40px;
      align-items: center;
      margin-bottom: 9px;
    }
    .weight-row:last-child {
      margin-bottom: 0;
    }
    .weight-row label {
      color: #334155;
      font-size: 12px;
      font-weight: 700;
    }
    .weight-row input {
      accent-color: #0284c7;
      width: 100%;
    }
    .weight-value {
      color: #0f172a;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .weight-summary {
      background: #f8fafc;
      border-radius: 6px;
      color: #475569;
      font-size: 11px;
      line-height: 1.45;
      margin-top: 10px;
      padding: 8px;
    }
    select, button {
      box-sizing: border-box;
      font: inherit;
      width: 100%;
    }
    select {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      color: #111827;
      font-size: 13px;
      padding: 8px 9px;
    }
    button {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      color: #334155;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 9px;
    }
    button:hover {
      background: #f8fafc;
    }
    .button-grid {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr 1fr;
    }
    .summary-grid {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr 1fr;
    }
    .summary-card {
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 10px;
    }
    .summary-value {
      font-size: 20px;
      font-weight: 800;
      line-height: 1;
    }
    .summary-name {
      color: #64748b;
      font-size: 11px;
      margin-top: 5px;
    }
    .detail-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      color: #334155;
      font-size: 12px;
      line-height: 1.55;
      min-height: 86px;
      padding: 10px;
    }
    .detail-title {
      color: #0f172a;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .nav-link {
      color: #2563eb;
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      margin-top: 8px;
      text-decoration: none;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
    .station-label {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(15, 23, 42, 0.2);
      border-radius: 4px;
      color: #0f172a;
      font-size: 11px;
      line-height: 1;
      padding: 3px 4px;
      white-space: nowrap;
    }
    @media (max-width: 860px) {
      #app {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) 320px;
      }
      #map {
        height: auto;
      }
      #side-panel {
        height: 320px;
        border-left: 0;
        border-top: 1px solid #d1d5db;
      }
    }
    .leaflet-pane,
    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow,
    .leaflet-tile-container,
    .leaflet-pane > svg,
    .leaflet-pane > canvas,
    .leaflet-zoom-box,
    .leaflet-image-layer,
    .leaflet-layer {
      position: absolute;

    }
    .leaflet-container {
      overflow: hidden;
      font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      outline-offset: 1px;
    }
    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow {

    }
    .leaflet-tile {

    .leaflet-overlay-pane { z-index: 400; }
    .leaflet-shadow-pane { z-index: 500; }
    .leaflet-marker-pane { z-index: 600; }
    .leaflet-tooltip-pane { z-index: 650; }

    .leaflet-left { left: 0; }

    .leaflet-top .leaflet-control { margin-top: 10px; }
    .leaflet-bottom .leaflet-control { margin-bottom: 10px; }

<body>
  <div id="app">
    <div id="map"></div>
    <aside id="side-panel" aria-label="그래프와 MST 지도 설정">
      <div class="panel-header">
        <div class="panel-title">Graph / MST 지도</div>
        <div class="panel-subtitle">전체 1,485개 경로 graph와 54개 MST 간선을 비교합니다.</div>
        <a class="nav-link" href="./">경로 확인 페이지로 돌아가기</a>
      </div>
      <div class="panel-body">
        <div class="field">
          <div class="field-label">표시 대상</div>
          <label class="layer-row">
            <input name="display-mode" value="graph" type="radio" checked>
            <span>
              <span class="layer-name">기본 graph</span>
              <span class="layer-meta">55개 지점의 모든 pair route</span>
            </span>
            <span class="swatch graph"></span>
          </label>
          <label class="layer-row">
            <input name="display-mode" value="mst" type="radio">
            <span>
              <span class="layer-name">최소신장수형도</span>
              <span class="layer-meta">기본 graph 위에 MST 강조</span>
            </span>
            <span class="swatch mst"></span>
          </label>
        </div>
        <div class="field">
          <div class="field-label">가중치 비율</div>
          <div class="weight-panel">
            <div class="weight-row">
              <label for="weight-distance">W1 거리</label>
              <input id="weight-distance" class="weight-input" data-weight-key="distance" type="range" min="0" max="1" step="0.05" value="0.25">
              <span id="weight-distance-value" class="weight-value">0.25</span>
            </div>
            <div class="weight-row">
              <label for="weight-lane">W2 차로</label>
              <input id="weight-lane" class="weight-input" data-weight-key="lane" type="range" min="0" max="1" step="0.05" value="0.25">
              <span id="weight-lane-value" class="weight-value">0.25</span>
            </div>
            <div class="weight-row">
              <label for="weight-w3">W3 제약</label>
              <input id="weight-w3" class="weight-input" data-weight-key="protection" type="range" min="0" max="1" step="0.05" value="0.25">
              <span id="weight-w3-value" class="weight-value">0.25</span>
            </div>
            <div class="weight-row">
              <label for="weight-slope">W4 경사</label>
              <input id="weight-slope" class="weight-input" data-weight-key="slope" type="range" min="0" max="1" step="0.05" value="0.25">
              <span id="weight-slope-value" class="weight-value">0.25</span>
            </div>
            <div id="weight-summary" class="weight-summary"></div>
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="basemap-select">지도 선택</label>
          <select id="basemap-select">
            <option value="vworldBase">VWorld 일반지도</option>
            <option value="vworldSatellite">VWorld 위성지도</option>
            <option value="osmBase">OpenStreetMap</option>
          </select>
        </div>
        <div class="field">
          <div class="button-grid">
            <button id="fit-all-button" type="button">전체 보기</button>
            <button id="fit-mst-button" type="button">MST 보기</button>
          </div>
        </div>
        <div class="field">
          <div class="summary-grid">
            <div class="summary-card">
              <div id="graph-count" class="summary-value">-</div>
              <div class="summary-name">기본 graph edge</div>
            </div>
            <div class="summary-card">
              <div id="mst-count" class="summary-value">-</div>
              <div class="summary-name">최소신장수형도 edge</div>
            </div>
          </div>
        </div>
        <div class="field">
          <div class="field-label">선택한 경로</div>
          <div id="detail-box" class="detail-box">지도 위 경로를 클릭하면 pair ID와 비용 정보를 확인할 수 있습니다.</div>
        </div>
      </div>
    </aside>
  </div>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="graph_mst_data.js?v=20260804-mst-fullgraph"></script>
  <script>
    const data = window.__siheungGraphMstData;
    const stationData = data.stationData;
    const routeData = data.routeData;
    const siheungBounds = L.latLngBounds(
      [37.27, 126.63],
      [37.50, 126.94]
    );
    const siheungCenter = [37.386, 126.755];
    const minimumCityZoom = 12;

    const map = L.map("map", {
      preferCanvas: true,
      zoomControl: true,
      center: siheungCenter,
      zoom: minimumCityZoom,
      minZoom: minimumCityZoom,
      maxBounds: siheungBounds.pad(0.08),
      maxBoundsViscosity: 1.0,
      worldCopyJump: false,
      zoomAnimation: false,
      fadeAnimation: false,
      markerZoomAnimation: false,
    });

    const baseLayers = {
      vworldBase: L.tileLayer("https://xdworld.vworld.kr/2d/Base/service/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.vworld.kr/">VWorld</a>',
      }),
      vworldSatellite: L.tileLayer("https://xdworld.vworld.kr/2d/Satellite/service/{z}/{x}/{y}.jpeg", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.vworld.kr/">VWorld</a>',
      }),
      osmBase: L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 20,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }),
    };
    baseLayers.vworldBase.addTo(map);

    const graphFeatures = routeData.features;
    let mstFeatures = [];
    const detailBox = document.getElementById("detail-box");
    const weightSummary = document.getElementById("weight-summary");
    const weightValueElements = {
      distance: document.getElementById("weight-distance-value"),
      lane: document.getElementById("weight-lane-value"),
      protection: document.getElementById("weight-w3-value"),
      slope: document.getElementById("weight-slope-value"),
    };
    const normalStationStyle = {
      radius: 5,
      color: "#111827",
      weight: 1.5,
      fillColor: "#ef4444",
      fillOpacity: 0.95,
    };

    function meters(value) {
      return Number(value).toLocaleString("ko-KR", { maximumFractionDigits: 0 }) + " m";
    }

    function cost(value) {
      if (value === undefined || value === null || Number.isNaN(Number(value))) return "-";
      return Number(value).toFixed(4);
    }

    function lane(value) {
      if (value === undefined || value === null || Number.isNaN(Number(value))) return "-";
      return Number(value).toFixed(2);
    }

    function showDetail(properties, layerName) {
      detailBox.innerHTML = `
        <div class="detail-title">${layerName} · ${properties.pair_id}</div>
        <div>${properties.from_station_name} → ${properties.to_station_name}</div>
        <div>거리: ${meters(properties.distance_m)} · 현재 비용: ${cost(properties.current_cost)}</div>
        <div>평균 차로 수: ${lane(properties.w2_average_lanes)} · W3: ${cost(properties.w3_protection_proxy)} · 경사: ${lane(properties.w4_average_absolute_grade_pct)}%</div>
      `;
    }

    function makeLayer(features, options) {
      return L.geoJSON({ type: "FeatureCollection", features }, {
        style: options.style,
        onEachFeature(feature, layer) {
          const p = feature.properties;
          layer.bindTooltip(`${options.name} · ${p.from_station_name} → ${p.to_station_name}`, {
            sticky: true,
          });
          layer.on("click", () => showDetail(p, options.name));
        },
      });
    }

    const graphLayer = makeLayer(graphFeatures, {
      name: "전체 graph",
      style: {
        color: "#64748b",
        weight: 1.35,
        opacity: 0.42,
      },
    }).addTo(map);

    let mstCasingLayer = L.layerGroup();
    let mstLayer = L.layerGroup();

    const stationLayer = L.geoJSON(stationData, {
      pointToLayer(feature, latlng) {
        return L.circleMarker(latlng, normalStationStyle);
      },
      onEachFeature(feature, layer) {
        const p = feature.properties;
        layer.bindTooltip(`${p.station_id}`, {
          permanent: true,
          direction: "top",
          offset: [0, -7],
          className: "station-label",
        });
      },
    }).addTo(map);

    function selectedMode() {
      return document.querySelector('input[name="display-mode"]:checked').value;
    }

    const maxDistance = Math.max(...graphFeatures.map((feature) => Number(feature.properties.distance_m) || 0));
    const maxProtection = Math.max(...graphFeatures.map((feature) => Number(feature.properties.w3_protection_proxy) || 0));

    function normalizedWeights() {
      const raw = {};
      document.querySelectorAll(".weight-input").forEach((input) => {
        raw[input.dataset.weightKey] = Number(input.value) || 0;
      });
      const sum = raw.distance + raw.lane + raw.protection + raw.slope;
      if (sum <= 0) {
        return { distance: 0.25, lane: 0.25, protection: 0.25, slope: 0.25 };
      }
      return {
        distance: raw.distance / sum,
        lane: raw.lane / sum,
        protection: raw.protection / sum,
        slope: raw.slope / sum,
      };
    }

    function lanePenalty(lanes) {
      const value = Number(lanes);
      if (!Number.isFinite(value) || value <= 0) return 1;
      return Math.min(1, 1 / value);
    }

    function slopePenalty(gradePct) {
      const value = Number(gradePct) || 0;
      if (value > 6) return 30;
      return value / 6;
    }

    function currentCost(properties, weights) {
      const distanceNorm = maxDistance > 0 ? Number(properties.distance_m) / maxDistance : 0;
      const protectionNorm = maxProtection > 0 ? Number(properties.w3_protection_proxy) / maxProtection : 0;
      return (
        weights.distance * distanceNorm
        + weights.lane * lanePenalty(properties.w2_average_lanes)
        + weights.protection * protectionNorm
        + weights.slope * slopePenalty(properties.w4_average_absolute_grade_pct)
      );
    }

    function recomputeCosts() {
      const weights = normalizedWeights();
      graphFeatures.forEach((feature) => {
        feature.properties.current_cost = currentCost(feature.properties, weights);
      });
      weightSummary.textContent = `적용 비율: W1 ${weights.distance.toFixed(2)}, W2 ${weights.lane.toFixed(2)}, W3 ${weights.protection.toFixed(2)}, W4 ${weights.slope.toFixed(2)}`;
    }

    class UnionFind {
      constructor(nodes) {
        this.parent = new Map(nodes.map((node) => [node, node]));
        this.rank = new Map(nodes.map((node) => [node, 0]));
      }
      find(node) {
        const parent = this.parent.get(node);
        if (parent !== node) {
          const root = this.find(parent);
          this.parent.set(node, root);
          return root;
        }
        return parent;
      }
      union(a, b) {
        const rootA = this.find(a);
        const rootB = this.find(b);
        if (rootA === rootB) return false;
        const rankA = this.rank.get(rootA);
        const rankB = this.rank.get(rootB);
        if (rankA < rankB) {
          this.parent.set(rootA, rootB);
        } else if (rankA > rankB) {
          this.parent.set(rootB, rootA);
        } else {
          this.parent.set(rootB, rootA);
          this.rank.set(rootA, rankA + 1);
        }
        return true;
      }
    }

    function recomputeMst() {
      const stationIds = stationData.features.map((feature) => feature.properties.station_id);
      const unionFind = new UnionFind(stationIds);
      const sorted = [...graphFeatures].sort((a, b) => {
        const costDiff = a.properties.current_cost - b.properties.current_cost;
        if (Math.abs(costDiff) > 1e-12) return costDiff;
        return Number(a.properties.distance_m) - Number(b.properties.distance_m);
      });
      const selected = [];
      for (const feature of sorted) {
        const p = feature.properties;
        const pairParts = p.pair_id.split("__");
        if (unionFind.union(pairParts[0], pairParts[1])) {
          selected.push(feature);
          if (selected.length === stationIds.length - 1) break;
        }
      }
      mstFeatures = selected;
    }

    function rebuildMstLayers() {
      const hadCasing = map.hasLayer(mstCasingLayer);
      const hadMst = map.hasLayer(mstLayer);
      if (hadCasing) mstCasingLayer.removeFrom(map);
      if (hadMst) mstLayer.removeFrom(map);
      mstCasingLayer = makeLayer(mstFeatures, {
        name: "MST",
        style: {
          color: "#ffffff",
          weight: 12,
          opacity: 0.96,
        },
      });
      mstLayer = makeLayer(mstFeatures, {
        name: "MST",
        style: {
          color: "#0284c7",
          weight: 7.5,
          opacity: 0.95,
        },
      });
    }

    function updateWeightsAndMst() {
      document.querySelectorAll(".weight-input").forEach((input) => {
        weightValueElements[input.dataset.weightKey].textContent = Number(input.value).toFixed(2);
      });
      recomputeCosts();
      recomputeMst();
      rebuildMstLayers();
      document.getElementById("mst-count").textContent = mstFeatures.length.toLocaleString("ko-KR");
      setDisplayMode();
    }

    function setDisplayMode() {
      const mode = selectedMode();
      if (!map.hasLayer(graphLayer)) graphLayer.addTo(map);
      if (mode === "graph") {
        graphLayer.setStyle({
          color: "#64748b",
          weight: 1.35,
          opacity: 0.42,
        });
        if (map.hasLayer(mstCasingLayer)) mstCasingLayer.removeFrom(map);
        if (map.hasLayer(mstLayer)) mstLayer.removeFrom(map);
      } else {
        graphLayer.setStyle({
          color: "#64748b",
          weight: 1.05,
          opacity: 0.12,
        });
        if (!map.hasLayer(mstCasingLayer)) mstCasingLayer.addTo(map);
        if (!map.hasLayer(mstLayer)) mstLayer.addTo(map);
        mstCasingLayer.bringToFront();
        mstLayer.bringToFront();
      }
      if (map.hasLayer(stationLayer)) stationLayer.bringToFront();
    }

    document.querySelectorAll('input[name="display-mode"]').forEach((input) => {
      input.addEventListener("change", setDisplayMode);
    });
    document.querySelectorAll(".weight-input").forEach((input) => {
      input.addEventListener("input", updateWeightsAndMst);
    });
    document.getElementById("basemap-select").addEventListener("change", (event) => {
      for (const layer of Object.values(baseLayers)) {
        if (map.hasLayer(layer)) map.removeLayer(layer);
      }
      baseLayers[event.target.value].addTo(map);
    });
    document.getElementById("fit-all-button").addEventListener("click", () => {
      map.fitBounds(siheungBounds, { padding: [24, 24], animate: false });
    });
    document.getElementById("fit-mst-button").addEventListener("click", () => {
      document.querySelector('input[name="display-mode"][value="mst"]').checked = true;
      setDisplayMode();
      map.fitBounds(mstLayer.getBounds(), { padding: [24, 24], animate: false });
    });

    document.getElementById("graph-count").textContent = data.summary.graph_edge_count.toLocaleString("ko-KR");
    document.getElementById("mst-count").textContent = data.summary.mst_edge_count.toLocaleString("ko-KR");
    updateWeightsAndMst();
    setTimeout(() => map.invalidateSize(), 0);
  </script>
</body>
</html>
